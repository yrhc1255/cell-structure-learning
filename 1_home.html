<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微觀細胞研究所</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <main class="hero-shell">
    <section class="hero-copy">
      <p class="eyebrow">研究任務 02</p>
      <h1>微觀細胞研究所</h1>
      <p class="lead">從虎克的軟木栓觀察出發，破解細胞的形態、功能與構造，建立你的細胞證據檔案。</p>
      <form id="student-form" class="identity-card">
        <h2>建立研究員資料</h2>
        <div class="form-grid">
          <label>班級代號<input id="class-code" autocomplete="off" required placeholder="例如：701"></label>
          <label>座號<input id="seat-number" type="number" min="1" max="99" required placeholder="例如：12"></label>
          <label class="full">名稱代碼<input id="name-code" autocomplete="off" required placeholder="請自行輸入名稱代碼"></label>
        </div>
        <p id="form-message" class="form-message" aria-live="polite"></p>
        <button class="primary-button" type="submit">進入研究所 <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <section class="microscope-stage" aria-label="顯微鏡視野中的原創細胞示意圖">
      <div class="scope-ring">
        <div class="cell cell-a"><span></span></div>
        <div class="cell cell-b"><span></span></div>
        <div class="cell cell-c"><span></span></div>
        <p>點亮微觀世界</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
